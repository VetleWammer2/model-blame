name: Research benchmarks

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  causal-origin:
    name: Causal Origin Benchmark (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Test exhaustive-landscape and attribution metrics
        run: pytest tests/unit/test_exhaustive_benchmark.py

      - name: Run committed Causal Origin benchmark suite
        run: python -m benchmarks.causal_origin.run --output benchmark-results

      - name: Upload machine-readable benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-origin-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 30
