name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Run unit, property, security, and remaining integration tests
        run: pytest --ignore=tests/integration/test_training_replay.py

      - name: Run real CPU training and replay integration
        run: pytest tests/integration/test_training_replay.py

      - name: Build source and wheel distributions
        run: python -m build
